<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>기획서 | 나만의 메모장</title>
<link rel="stylesheet" href="site.css">
<script src="site.js"></script>
</head>
<body>
<header class="top">
  <h1>❄️ 나만의 메모장</h1>
  <nav>
    <a href="memo.html">메모장 열기</a>
    <a href="PRD.html" class="on">기획서</a>
    <a href="code.html">스크립트</a>
  </nav>
  <button class="btn" id="themeBtn" title="다크 모드 켜기/끄기">🌙</button>
</header>

<main class="wrap">
  <article class="card" id="doc">기획서를 불러오는 중…</article>
  <p class="note">원본 파일: <a href="PRD.md">PRD.md</a> · 이 페이지는 PRD.md를 읽어서 보기 좋게 보여 줍니다.</p>
</main>

<script>
  // PRD.md(마크다운)를 읽어서 제목·표·목록으로 바꿔 보여 주는 아주 작은 변환기예요.
  // 글자는 먼저 안전하게 처리(esc)한 뒤에 굵게/코드 표시만 바꿔요.
  function esc(s) { return s.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;"); }
  function inline(s) {
    s = esc(s);
    s = s.replace(/`([^`]+)`/g, "<code>$1</code>");
    s = s.replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>");
    return s;
  }
  const BLOCK_START = /^(#{1,3}\s|---|>|\||\s*[-*]\s|\d+\.\s)/;

  function render(md) {
    const lines = md.replace(/\r/g, "").split("\n");
    const out = [];
    let i = 0;
    while (i < lines.length) {
      const l = lines[i];
      if (!l.trim()) { i++; continue; }
      let m;
      if ((m = l.match(/^(#{1,3})\s+(.*)/))) {                       // 제목
        out.push(`<h${m[1].length}>${inline(m[2])}</h${m[1].length}>`); i++; continue;
      }
      if (/^---+$/.test(l.trim())) { out.push("<hr>"); i++; continue; }  // 구분선
      if (l.startsWith(">")) {                                          // 인용
        const b = [];
        while (i < lines.length && lines[i].startsWith(">")) { b.push(lines[i].replace(/^>\s?/, "")); i++; }
        out.push("<blockquote>" + b.map(inline).join("<br>") + "</blockquote>"); continue;
      }
      if (l.trim().startsWith("|")) {                                   // 표
        const rows = [];
        while (i < lines.length && lines[i].trim().startsWith("|")) { rows.push(lines[i].trim()); i++; }
        const cells = r => r.replace(/^\||\|$/g, "").split("|").map(c => c.trim());
        const head = cells(rows[0]), body = rows.slice(2).map(cells);
        out.push('<div class="tbl"><table><thead><tr>' + head.map(c => "<th>" + inline(c) + "</th>").join("") +
          "</tr></thead><tbody>" + body.map(r => "<tr>" + r.map(c => "<td>" + inline(c) + "</td>").join("") + "</tr>").join("") +
          "</tbody></table></div>");
        continue;
      }
      if (/^\s*[-*]\s+/.test(l)) {                                      // 점 목록
        const it = [];
        while (i < lines.length && /^\s*[-*]\s+/.test(lines[i])) { it.push(lines[i].replace(/^\s*[-*]\s+/, "")); i++; }
        out.push("<ul>" + it.map(x => "<li>" + inline(x) + "</li>").join("") + "</ul>"); continue;
      }
      if (/^\d+\.\s+/.test(l)) {                                        // 번호 목록
        const it = [];
        while (i < lines.length && /^\d+\.\s+/.test(lines[i])) { it.push(lines[i].replace(/^\d+\.\s+/, "")); i++; }
        out.push("<ol>" + it.map(x => "<li>" + inline(x) + "</li>").join("") + "</ol>"); continue;
      }
      const p = [l]; i++;                                               // 일반 문단
      while (i < lines.length && lines[i].trim() && !BLOCK_START.test(lines[i])) { p.push(lines[i]); i++; }
      out.push("<p>" + p.map(inline).join("<br>") + "</p>");
    }
    return out.join("\n");
  }

  fetch("PRD.md")
    .then(r => { if (!r.ok) throw new Error(r.status); return r.text(); })
    .then(md => { document.getElementById("doc").innerHTML = render(md); })
    .catch(() => {
      document.getElementById("doc").innerHTML = '기획서를 불러오지 못했어요. <a href="PRD.md">PRD.md 원본 보기</a>';
    });
</script>
</body>
</html>
